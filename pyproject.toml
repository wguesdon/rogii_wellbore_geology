[project]
name = "rogii-wellbore-geology"
version = "1.0.0"
description = "Final code and experiment harness for Kaggle's ROGII Wellbore Geology Prediction competition."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.7",
    "joblib>=1.4.2",
    "lightgbm>=4.5.0",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "torch>=2.4.0",
    "xgboost>=2.1.0",
]

[tool.uv]
package = false
